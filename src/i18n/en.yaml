commands:
  ping:
    name: "ping"
    description: "Check if the bot is alive"
    response:
      title: "🏓 Pong!"
      description: "Bot is up and running"

  invites:
    name: "invites"
    description: "Create an invite link"
    errors:
      server_not_allowed:
        title: "❌ Server Not Allowed"
        description: "This server is not configured to use this bot"
        footer: "Contact the bot administrator for access"
      missing_permissions:
        title: "❌ Missing Permissions"
        description: "You don't have the required role to use this command"
        footer: "Contact a server administrator for access"
      limit_reached:
        title: "❌ Invite Limit Reached"
        description: "You can only invite {count} people in the past {days} days"
        status: "Current Status"
        used: "{count} used"
        remaining: "{remaining} remaining"
        footer: "Try again when your limit resets"
      join_date_not_found:
        title: "❌ Join Date Not Found"
        description: "Failed to fetch join date"
        footer: "This is likely a Discord API error"
      not_long_enough:
        title: "❌ Not Long Enough"
        description: "You must be in the server for at least {days} days"
        footer: "Try again in {remaining} days"
    success:
      title: "🎫 New Invite Created"
      description: "Here's your invite link for **{guild}**"
      limits: "Limits"
      invites_per_days: "{count} invites per {days} days"
      used_remaining: "{used} used, {remaining} remaining"
      footer: "🔒 This invite link is unique to you"

  inviter:
    name: "inviter"
    description: "Check who invited a user"
    param_user: "User to check"
    errors:
      no_record:
        title: "❌ No Record Found"
        description: "No invite record found for {user}"
        footer: "This user may have joined through other means"
      invalid_user:
        title: "❌ Invalid User ID"
        description: "Unable to get inviter information"
        footer: "This could be a database error"
      join_date_not_found:
        title: "❌ Join date not found"
        description: "Unable to get user join date"
        footer: "This could be a Discord API error"
    private:
      title: "👤 Anonymous Invite"
      description: "{user} joined through a private (anonymous) invite"
      footer: "Inviter information is hidden for privacy reasons"
    success:
      title: "👥 Invitation Info"
      user: "User"
      invited_by: "Invited by"
      date: "Date"
      invite_code: "Invite code"
      footer: "🔍 Use /invites-leaderboard to see the leaderboard"

  invites_leaderboard:
    name: "invites-leaderboard"
    description: "View the invite leaderboard"
    param_days: "Days to look back (default: 30)"
    errors:
      no_invites:
        title: "📊 Invite Leaderboard"
        description: "No invite records in the past {days} days"
        footer: "Please try again later"
    success:
      title: "Invite Leaderboard - {guild}"
      footer: "🔥 Use /invites to get your invite link"

  admin_invites_leaderboard:
    name: "admin-invites-leaderboard"
    description: "View the complete invite leaderboard including private invites (Admin only)"
    param_days: "Days to look back (default: 30)"
    errors:
      no_invites:
        title: "📊 Admin Invite Leaderboard"
        description: "No invite records in the past {days} days"
        footer: "Please try again later"
    success:
      title: "Admin Invite Leaderboard - {guild}"
      includes_private: "This leaderboard includes all invites (including private ones)"
      footer: "👁️ Visible to admins only"

  invite_private:
    name: "invite-private"
    description: "Create a private invite link (anonymous inviter)"
    errors:
      server_not_allowed:
        title: "❌ Server Not Allowed"
        description: "This server is not configured to use this bot"
        footer: "Contact the bot administrator for access"
      missing_permissions:
        title: "❌ Missing Permissions"
        description: "You don't have the required role to use the private invite command"
        footer: "Contact a server administrator for access"
      limit_reached:
        title: "❌ Private Invite Limit Reached"
        description: "You can only create {count} private invites in the past {days} days"
        status: "Current Status"
        used: "{used} used"
        remaining: "{remaining} remaining"
        footer: "Try again when your private invite limit resets"
      join_date_not_found:
        title: "❌ Join Date Not Found"
        description: "Failed to fetch join date"
        footer: "This is likely a Discord API error"
      not_long_enough:
        title: "❌ Not Long Enough"
        description: "You must be in the server for at least {days} days to create a private invite"
        footer: "Try again in {remaining} days"
    success:
      title: "🎫 New Private Invite Created"
      description: "Here's your **private** invite link for **{guild}**. Your identity as the inviter is anonymous to regular users."
      limits: "Private Invite Limits"
      invites_per_days: "{count} private invites per {days} days"
      used_remaining: "{used} used, {remaining} remaining."
      footer: "⚠️ Please note that all invite records are saved in the system. Administrators may access the complete invite history when necessary."

server:
  running: "HTTP server running on {addr}"

errors:
  command:
    title: "❌ Command Error"
    description: "An error occurred while executing the command"
    footer: "Please try again later"
  db:
    mark_invite_used: "Failed to mark invite as used: {error}"
  server:
    invalid_address: "Failed to parse server address"
    bind_failed: "Failed to bind server"
    start_failed: "Failed to start HTTP server"
  unknown: "Unknown error occurred: {error}"
  setup: "Failed to start bot: {error}"

http:
  errors:
    internal: "Internal server error: {error}"
    invalid_invite: "This invite link has expired or is invalid"
    server_not_found: "Server configuration not found"
    invalid_channel: "Invalid channel configuration"
    create_failed: "Failed to create invite: {error}"
    update_failed: "Failed to update invite: {error}"

bot:
  logged_in: "Logged in as {name}" 